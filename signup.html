<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EquitySkill – Signup</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
}
.container{
  max-width:420px;
  margin:60px auto;
  padding:20px;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 14px 40px rgba(0,0,0,.08);
}
h2{
  margin:0 0 6px;
}
p{
  margin:0 0 14px;
  color:#6b7280;
  font-size:14px;
}
input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #e5e7eb;
  margin-bottom:12px;
  font-size:14px;
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}
button:disabled{
  opacity:.6;
  cursor:not-allowed;
}
.error{
  font-size:13px;
  color:#dc2626;
  margin-bottom:10px;
}
.link{
  text-align:center;
  margin-top:14px;
}
.link a{
  color:#2563eb;
  font-weight:600;
  text-decoration:none;
}
.mode{
  font-size:12px;
  font-weight:700;
  color:#2563eb;
  margin-bottom:10px;
}
</style>

<script src="config.js"></script>
</head>

<body>

<div class="container">
  <div class="card">

    <div class="mode" id="modeText">—</div>

    <h2>Create Account</h2>
    <p>Join EquitySkill (free)</p>

    <div class="error" id="error"></div>

    <!-- ✅ IDs ARE MANDATORY -->
    <input id="username" placeholder="Choose username">
    <input id="fullname" placeholder="Full name">
    <input id="email" placeholder="Email">
    <input id="phone" placeholder="Phone number">

    <button id="signupBtn" type="button" onclick="signup()">Signup</button>

    <div class="link">
      Already have an account? <a href="login.html">Login</a>
    </div>

  </div>
</div>

<script>
/* ================= CONFIG ================= */
const MODE = getGameMode();
const USER_API = CONFIG.USER_WEB_APP_URL;

/* ================= UI ================= */
document.getElementById("modeText").innerText =
  MODE === "daily"
    ? "📅 Daily Challenge Signup"
    : "🏆 Weekly Challenge Signup";

/* ================= SIGNUP ================= */
function signup(){

  const errorEl = document.getElementById("error");
  const btn = document.getElementById("signupBtn");

  errorEl.innerText = "";

  const username = document.getElementById("username").value.trim().toLowerCase();
  const fullname = document.getElementById("fullname").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const phone = document.getElementById("phone").value.trim();

  if(!username || !phone){
    errorEl.innerText = "Username and phone are mandatory";
    return;
  }
  if(!/^\d{10}$/.test(phone)){
  alert("Enter a valid 10-digit phone number");
  return;
}

  btn.disabled = true;
  btn.innerText = "Creating account...";

  const url =
    `${USER_API}?action=signupUser` +
    `&username=${encodeURIComponent(username)}` +
    `&name=${encodeURIComponent(fullname)}` +
    `&email=${encodeURIComponent(email)}` +
    `&phone=${encodeURIComponent(phone)}`;

  fetch(url)
    .then(res => res.json())
    .then(d => {

      if(!d.success){
        errorEl.innerText = d.message || "Signup failed";
        btn.disabled = false;
        btn.innerText = "Signup";
        return;
      }

      alert("✅ Account created successfully. Please login.");
      location.href = "login.html";
    })
    .catch(() => {
      errorEl.innerText = "Network error. Try again.";
      btn.disabled = false;
      btn.innerText = "Signup";
    });
}
</script>

</body>
</html>
