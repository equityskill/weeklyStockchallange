<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EquitySkill – User Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --primary:#2563eb;
  --bg:#f5f7fb;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#1f2937;
  --muted:#6b7280;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.container{
  max-width:720px;
  margin:30px auto;
  padding:16px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}
.brand{
  font-size:22px;
  font-weight:800;
  color:var(--primary);
}
.header a{
  text-decoration:none;
  font-weight:600;
  color:var(--primary);
}

/* CARD */
.card{
  background:var(--card);
  border-radius:18px;
  padding:18px;
  box-shadow:0 14px 40px rgba(0,0,0,.08);
  margin-bottom:16px;
}

h2,h3{
  margin:0 0 10px;
}
p{
  margin:6px 0;
  font-size:14px;
  color:var(--muted);
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px;
}
.stat{
  background:#f1f5f9;
  border-radius:14px;
  padding:14px;
  text-align:center;
}
.stat h3{
  margin:0;
  font-size:22px;
}
.stat p{
  margin:4px 0 0;
  font-size:12px;
}

/* SCORE LIST */
.list{
  list-style:none;
  padding:0;
  margin:0;
}
.list li{
  padding:10px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
}

.badge{
  font-size:12px;
  font-weight:700;
  padding:4px 10px;
  border-radius:999px;
  background:#e0e7ff;
  color:#3730a3;
}

.me-badge{
  background:#2563eb;
  color:#fff;
}
</style>

<script src="config.js"></script>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="brand">👤 User Profile</div>
    <a href="leaderboard.html">← Back</a>
  </div>

  <!-- BASIC INFO -->
  <div class="card">
    <h2 id="usernameText">@username</h2>
    <p id="modeText">—</p>
  </div>

  <!-- STATS -->
  <div class="card">
    <h3>Performance Stats</h3>
    <div class="stats">
      <div class="stat">
        <h3 id="totalGames">—</h3>
        <p>Games Played</p>
      </div>
      <div class="stat">
        <h3 id="bestScore">—</h3>
        <p>Best Score</p>
      </div>
      <div class="stat">
        <h3 id="avgScore">—</h3>
        <p>Average Score</p>
      </div>
    </div>
  </div>

  <!-- SCORE HISTORY -->
  <div class="card">
    <h3>Score History</h3>
    <ul class="list" id="scoreList">
      <li>Loading…</li>
    </ul>
  </div>

</div>

<script>
/* ================= CONFIG ================= */
const MODE = getGameMode();      // daily | weekly
const API  = getAPI();

/* ================= USER ================= */
const params = new URLSearchParams(window.location.search);
const profileUser = params.get("user");

if(!profileUser){
  alert("User not specified");
  location.href = "leaderboard.html";
}

const loggedUser = JSON.parse(localStorage.getItem("user"));

document.getElementById("usernameText").innerHTML =
  `@${profileUser}
   ${loggedUser && loggedUser.username === profileUser
      ? '<span class="badge me-badge">YOU</span>'
      : ''}`;

document.getElementById("modeText").innerText =
  MODE === "daily"
    ? "📅 Daily Challenge Profile"
    : "🏆 Weekly Challenge Profile";

/* ================= LOAD PROFILE ================= */
fetch(`${API}?action=myScores&username=${encodeURIComponent(profileUser)}`)
  .then(r => r.json())
  .then(d => {

    const totalGamesEl = document.getElementById("totalGames");
    const bestScoreEl  = document.getElementById("bestScore");
    const avgScoreEl   = document.getElementById("avgScore");
    const ul           = document.getElementById("scoreList");

    // ❌ No data case
    if (d.status !== "FOUND") {
      totalGamesEl.innerText = 0;
      bestScoreEl.innerText  = 0;
      avgScoreEl.innerText   = 0;
      ul.innerHTML = `<li>No games played yet</li>`;
      return;
    }

    // ✅ Correct data
    totalGamesEl.innerText = d.totalGames;
    bestScoreEl.innerText  = d.bestScore;
    avgScoreEl.innerText   = d.avgScore;

    // ℹ️ Score history not implemented yet
    ul.innerHTML = `
      <li>
        Score history will be available soon
      </li>
    `;
  })
  .catch(() => {
    document.getElementById("scoreList").innerHTML =
      `<li>Error loading profile</li>`;
  });

</script>

</body>
</html>
