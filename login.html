<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EquitySkill – Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
}
.container{
  max-width:420px;
  margin:80px auto;
  padding:20px;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 14px 40px rgba(0,0,0,.08);
}
h2{
  margin:0 0 6px;
}
p{
  margin:0 0 14px;
  color:#6b7280;
  font-size:14px;
}
input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #e5e7eb;
  margin-bottom:12px;
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}
.error{
  font-size:13px;
  color:#dc2626;
  margin-bottom:10px;
}
.link{
  text-align:center;
  margin-top:14px;
}
.link a{
  color:#2563eb;
  font-weight:600;
  text-decoration:none;
}
.mode{
  font-size:12px;
  font-weight:700;
  color:#2563eb;
  margin-bottom:10px;
}

.login-nav{
    display:flex;
  justify-content:flex-end;
  margin-bottom:8px;
}

.nav-btn{
  border:none;
  background:#f1f5f9;
  padding:6px 12px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
}

.nav-btn:hover{
  background:#e5e7eb;
}

.nav-btn.home{
    background:#2563eb;
  color:#fff;
  border:none;
  padding:6px 12px;   /* 👈 chhota size */
  border-radius:8px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;

}

.login-top{
  display:flex;
  justify-content:flex-end;
  margin-bottom:10px;
}

.home-btn{
  background:#2563eb;
  color:#fff;
  border:none;
  padding:6px 12px;   /* 👈 chhota size */
  border-radius:8px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  width:auto; 
}

.home-btn:hover{
  background:#1d4ed8;
}





</style>

<script src="config.js"></script>
</head>

<body>

  
<div class="container">
  <div class="card">

   <div class="login-top">
  <button class="home-btn" onclick="goHome()">🏠 Home</button>
</div>



    <div class="mode" id="modeText">—</div>

    <h2>Login</h2>
    <p>Welcome back to EquitySkill</p>

    <div class="error" id="error"></div>

    <input id="username" placeholder="Username">
    <input id="phone" placeholder="Phone number">

    <button onclick="login()">Login</button>

    <div class="link">
      New here? <a href="signup.html">Create account</a>
    </div>

  </div>
</div>

<script>
/* ================= CONFIG ================= */
const MODE = getGameMode();
const USER_API = CONFIG.USER_WEB_APP_URL;

/* ================= UI ================= */
document.getElementById("modeText").innerText =
  document.getElementById("modeText").innerText =
  "🔐 EquitySkill Login";


/* ================= LOGIN ================= */
function login(){
  const u = document.getElementById("username").value.trim().toLowerCase();
const p = document.getElementById("phone").value.trim();


  if(!u || !p){
    error.innerText = "Username and phone required";
    return;
  }

  fetch(`${USER_API}?action=loginUser&username=${encodeURIComponent(u)}&phone=${encodeURIComponent(p)}`)
    .then(r=>r.json())
    .then(d=>{
      if(!d.success){
        error.innerText = "Invalid username or phone";
        return;
      }

      // ✅ Save session
      localStorage.setItem("user", JSON.stringify(d.user));

      // Redirect based on mode
      const redirect =
  new URLSearchParams(window.location.search).get("redirect");

location.href = redirect
  ? decodeURIComponent(redirect)
  : "index.html";

    })
    .catch(()=>{
      error.innerText = "Login failed. Try again.";
    });
}

function goBack(){
  history.back();
}

function goHome(){
  location.href = "index.html"; // agar home ka naam index.html hai
}

</script>

</body>
</html>
