<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EquitySkill – Leaderboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --primary:#2563eb;
  --bg:#f5f7fb;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#1f2937;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
.container{
  max-width:720px;
  margin:30px auto;
  padding:16px;
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}
.brand{
  font-size:22px;
  font-weight:800;
  color:var(--primary);
}
.header a{
  text-decoration:none;
  font-weight:600;
  color:var(--primary);
}
.card{
  background:var(--card);
  border-radius:18px;
  padding:18px;
  box-shadow:0 14px 40px rgba(0,0,0,.08);
  margin-bottom:16px;
}
.stats-tabs{
  display:flex;
  gap:12px;
  margin-bottom:12px;
}
.tab{
  padding:8px 18px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  font-weight:700;
  background:#e5e7eb;
}
.tab.active{
  background:#2563eb;
  color:#fff;
}
.summary{
  display:flex;
  gap:12px;
}
.summary div{
  flex:1;
  background:#f1f5f9;
  border-radius:14px;
  padding:14px;
  text-align:center;
}
.table{
  width:100%;
  border-collapse:collapse;
}
.table th,.table td{
  padding:12px;
  border-bottom:1px solid var(--border);
}
.rank{font-weight:800}
.me{
  background:#ecfeff;
  border-left:4px solid var(--primary);
}
.you-badge{
  margin-left:6px;
  font-size:11px;
  padding:2px 8px;
  background:var(--primary);
  color:#fff;
  border-radius:999px;
}

/* CLICKABLE LEADERBOARD ROW */
.row{
  cursor:pointer;
  transition:background .15s ease;
}

.row:hover{
  background:#f0f9ff;
}

.row.me{
  background:#ecfeff;
  font-weight:700;
}

</style>

<script src="config.js"></script>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="brand" id="pageTitle">🏆 Weekly Leaderboard</div>
    <div>
      <a href="index.html">🏠 Home</a> |
      <a href="dashboard.html">Dashboard</a>
    </div>
  </div>

  <!-- TOGGLE -->
  <div class="stats-tabs">
    <button class="tab active" onclick="switchMode('weekly', this)">Weekly</button>
    <button class="tab" onclick="switchMode('daily', this)">Daily</button>
  </div>

  <!-- USER SUMMARY -->
  <div class="card">
    <div class="summary">
      <div>
        <h3 id="myRank">—</h3>
        <p>Your Rank</p>
      </div>
      <div>
        <h3 id="myScore">—</h3>
        <p>Your Score</p>
      </div>
    </div>
  </div>

  <!-- LEADERBOARD -->
  <div class="card">
    <select id="periodSelect" onchange="loadLeaderboard()"></select>

    <table class="table">
      <thead>
        <tr>
          <th>#</th>
          <th>User</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody id="leaderboardBody"></tbody>
    </table>
  </div>

</div>

<script>
const user = JSON.parse(localStorage.getItem("user"));
if(!user){ location.href="login.html"; }

let MODE = "weekly";
let API = CONFIG.WEEKLY_WEB_APP_URL;

function switchMode(mode, btn){
  MODE = mode;
  API = mode==="weekly" ? CONFIG.WEEKLY_WEB_APP_URL : CONFIG.DAILY_WEB_APP_URL;

  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  document.getElementById("pageTitle").innerText =
    mode==="weekly" ? "🏆 Weekly Leaderboard" : "⚡ Daily Leaderboard";

  loadPeriods();
}

function loadPeriods(){
  fetch(`${API}?action=previousResults`)
    .then(r=>r.json())
    .then(d=>{
      const sel=document.getElementById("periodSelect");
      sel.innerHTML="";
      d.results.forEach(r=>{
        sel.innerHTML+=`<option>${r.week}</option>`;
      });
      loadLeaderboard();
    });
}

function loadLeaderboard(){
  const period=document.getElementById("periodSelect").value;
  fetch(`${API}?action=${MODE}Leaderboard&period=${period}`)
    .then(r=>r.json())
    .then(d=>{
      const body=document.getElementById("leaderboardBody");
      body.innerHTML="";
      let myRank="—", myScore="—";

      d.leaderboard.forEach((u,i)=>{
        const isMe=u.username===user.username;
        if(isMe){ myRank=`#${i+1}`; myScore=u.score; }

        body.innerHTML += `
<tr class="row ${isMe?"me":""}"
    onclick="openProfile('${u.username}')">

  <td class="rank">${i+1}</td>
  <td>
    <b>@${u.username}</b>
    ${isMe?'<span class="you-badge">YOU</span>':''}
  </td>
  <td>${u.score}</td>
</tr>`;

      });

      myRankEl.innerText=myRank;
      myScoreEl.innerText=myScore;
    });
}

const myRankEl=document.getElementById("myRank");
const myScoreEl=document.getElementById("myScore");

window.onload=()=>loadPeriods();

function openProfile(username){
  location.href = `profile.html?mode=${MODE}&user=${username}`;
}

</script>

</body>
</html>
