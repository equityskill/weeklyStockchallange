<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EquitySkill – Leaderboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --primary:#2563eb;
  --bg:#f5f7fb;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#1f2937;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
.container{
  max-width:720px;
  margin:30px auto;
  padding:16px;
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}
.brand{
  font-size:22px;
  font-weight:800;
  color:var(--primary);
}
.header a{
  text-decoration:none;
  font-weight:600;
  color:var(--primary);
}
.card{
  background:var(--card);
  border-radius:18px;
  padding:18px;
  box-shadow:0 14px 40px rgba(0,0,0,.08);
  margin-bottom:16px;
}
.stats-tabs{
  display:flex;
  gap:12px;
  margin-bottom:12px;
}
.tab{
  padding:8px 18px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  font-weight:700;
  background:#e5e7eb;
}
.tab.active{
  background:#2563eb;
  color:#fff;
}
.summary{
  display:flex;
  gap:12px;
}
.summary div{
  flex:1;
  background:#f1f5f9;
  border-radius:14px;
  padding:14px;
  text-align:center;
}
.table{
  width:100%;
  border-collapse:collapse;
}
.table th,.table td{
  padding:12px;
  border-bottom:1px solid var(--border);
}
.rank{font-weight:800}
.me{
  background:#ecfeff;
  border-left:4px solid var(--primary);
}
.you-badge{
  margin-left:6px;
  font-size:11px;
  padding:2px 8px;
  background:var(--primary);
  color:#fff;
  border-radius:999px;
}

/* CLICKABLE LEADERBOARD ROW */
.row{
  cursor:pointer;
  transition:background .15s ease;
}

.row:hover{
  background:#f0f9ff;
}

.row.me{
  background:#ecfeff;
  font-weight:700;
}

</style>

<script src="config.js"></script>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="brand" id="pageTitle">🏆 Weekly Leaderboard</div>
    <div>
      <a href="index.html">🏠 Home</a> |
      <a href="dashboard.html">Dashboard</a>
    </div>
  </div>

  <!-- TOGGLE -->
  <div class="stats-tabs">
    <button class="tab active" onclick="switchMode('weekly', this)">Weekly</button>
    <button class="tab" onclick="switchMode('daily', this)">Daily</button>
  </div>

  <!-- USER SUMMARY -->
  <div class="card">
    <div class="summary">
      <div>
        <h3 id="myRank">—</h3>
        <p>Your Rank</p>
      </div>
      <div>
        <h3 id="myScore">—</h3>
        <p>Your Score</p>
      </div>
    </div>
  </div>

  <!-- LEADERBOARD -->
  <div class="card">
    <select id="periodSelect" onchange="onPeriodChange()"></select>

    <table class="table">
      <thead>
        <tr>
          <th>#</th>
          <th>User</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody id="leaderboardBody"></tbody>
    </table>
  </div>

</div>

<script>
const user = JSON.parse(localStorage.getItem("user"));
if(!user){ location.href="login.html"; }

let MODE = "weekly";
let API = CONFIG.WEEKLY_WEB_APP_URL;



function switchMode(mode, btn){

  MODE = mode;

  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  document.getElementById("pageTitle").innerText =
    mode==="weekly" ? "🏆 Weekly Leaderboard" : "⚡ Daily Leaderboard";

  // 🔥 IMPORTANT: clear old dropdown
  document.getElementById("periodSelect").innerHTML = "";

  if(mode === "weekly"){
    loadWeeklyPeriods();
  } else {
    loadDailyPeriods();
  }
}


function loadWeeklyPeriods(){

  fetch(`${CONFIG.WEEKLY_WEB_APP_URL}?action=previousResults`)
    .then(r=>r.json())
    .then(d=>{

      const sel = document.getElementById("periodSelect");
      sel.innerHTML = "";

      d.results.forEach(r=>{
        const opt = document.createElement("option");
        opt.value = r.week;
        opt.textContent = r.week;
        sel.appendChild(opt);
      });

      if(d.results.length){
        loadWeeklyLeaderboard(d.results[0].week);
      }
    });
}
function loadDailyPeriods(){

  fetch(`${CONFIG.DAILY_WEB_APP_URL}?action=dailyResultDays`)
    .then(r=>r.json())
    .then(d=>{

      const sel = document.getElementById("periodSelect");
      sel.innerHTML = "";

      d.days.forEach(day=>{
        const opt = document.createElement("option");
        opt.value = day;
        opt.textContent = day; // YYYY-MM-DD
        sel.appendChild(opt);
      });

      if(d.days.length){
        loadDailyLeaderboard(d.days[0]);
      }
    });
}

function loadWeeklyLeaderboard(){

  const week = document.getElementById("periodSelect").value;

  fetch(`${CONFIG.WEEKLY_WEB_APP_URL}?action=weeklyLeaderboard&period=${week}`)
    .then(r=>r.json())
    .then(d=>{
      renderLeaderboard(d.leaderboard);
    });
}
function loadDailyLeaderboard(){

  const day = document.getElementById("periodSelect").value;

  fetch(`${CONFIG.DAILY_WEB_APP_URL}?action=dailyLeaderboard&day=${day}`)
    .then(r=>r.json())
    .then(d=>{
      renderLeaderboard(d.leaderboard);

    });
}

function onPeriodChange(){
  if(MODE === "weekly"){
    loadWeeklyLeaderboard();
  } else {
    loadDailyLeaderboard();
  }
}

const myRankEl = document.getElementById("myRank");
const myScoreEl = document.getElementById("myScore");

function renderLeaderboard(list){

  const body = document.getElementById("leaderboardBody");
  body.innerHTML = "";

  let myRank = "—";
  let myScore = "—";

  list.forEach((u, i) => {

    const username = u.username || u.user; // weekly / daily compatibility
    const score = u.score;

    const isMe = username === user.username;
    if(isMe){
      myRank = `#${i+1}`;
      myScore = score;
    }

    body.innerHTML += `
      <tr class="row ${isMe ? "me" : ""}">
        <td class="rank">${i+1}</td>
        <td>
          <b>@${username}</b>
          ${isMe ? '<span class="you-badge">YOU</span>' : ''}
        </td>
        <td>${score}</td>
      </tr>
    `;
  });

  document.getElementById("myRank").innerText = myRank;
  document.getElementById("myScore").innerText = myScore;
}


window.onload = () => {
  // default mode = weekly
  loadWeeklyPeriods();
};

window.onload = () => {
  switchMode("weekly", document.querySelector(".tab.active"));
};

</script>

</body>
</html>
