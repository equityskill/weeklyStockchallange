<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EquitySkill – My Submission</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --primary:#2563eb;
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --border:#e5e7eb;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* ===== HEADER ===== */
.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.topbar-inner{
  max-width:900px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.brand{
  display:flex;
  gap:12px;
  align-items:center;
}
.logo-box{
  width:44px;
  height:44px;
  border-radius:12px;
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:#fff;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
}
.brand-name{font-weight:800}
.brand-tagline{font-size:11px;color:#6b7280}
.nav-btn{
  background:#e5e7eb;
  color:#111;
  padding:8px 16px;
  border-radius:10px;
  font-size:14px;
  font-weight:600;
  text-decoration:none;
}

/* ===== PAGE ===== */
.container{
  max-width:420px;
  margin:40px auto;
  padding:20px;
}
.card{
  background:#fff;
  border-radius:16px;
  padding:22px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}
h2{margin-top:0}

select,button{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:10px;
  border:1px solid var(--border);
}
button{
  background:var(--primary);
  color:#fff;
  border:none;
  font-weight:600;
  cursor:pointer;
}
button.secondary{
  background:#e5e7eb;
  color:#111;
}
.label{
  font-weight:600;
  margin-top:14px;
}
.box{
  margin-top:10px;
  font-size:14px;
}
.error{
  color:#dc2626;
  font-size:13px;
  margin-top:10px;
}
</style>

<script src="config.js"></script>
</head>

<body>

<!-- HEADER -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo-box">ES</div>
      <div>
        <div class="brand-name">EquitySkill</div>
        <div class="brand-tagline">My Submission</div>
      </div>
    </div>
    <a class="nav-btn" href="dashboard.html">Dashboard</a>
  </div>
</header>

<!-- CONTENT -->
<div class="container">
  <div class="card">

    <h2>📄 My Submission</h2>

    <div id="resultBox" style="display:none">
      <div class="label">Week</div>
      <select id="weekSelect" onchange="changeWeek()"></select>

      <div class="box">
        <div class="label">Selected 5 Stocks</div>
        <div id="stocks"></div>
      </div>

      <div class="box">
        <div class="label">Top 3 Ranking</div>
        <div id="ranking"></div>
      </div>
    </div>

    <div class="error" id="err"></div>

  </div>
</div>

<script>
const API = CONFIG.WEB_APP_URL;

/* ===== LOGIN CHECK ===== */
const user = JSON.parse(localStorage.getItem("user"));
if(!user){
  alert("Please login to view your submission");
  location.href = "login.html";
}

/* ===== LOAD SUBMISSION ===== */
window.onload = () => {
  loadSubmission();
};

function loadSubmission(week=""){
  fetch(`${API}?action=mySubmission&username=${encodeURIComponent(user.username)}&week=${week}`)
    .then(r => r.json())
    .then(d => {

      if(d.status !== "FOUND"){
        err.innerText = "No submission found for your account.";
        return;
      }

      err.innerText = "";
      resultBox.style.display = "block";

      weekSelect.innerHTML = "";
      d.weeks.forEach(w=>{
        weekSelect.innerHTML +=
          `<option ${w===d.currentWeek?"selected":""}>${w}</option>`;
      });

      stocks.innerHTML = d.selected5.map(s => "• " + s).join("<br>");

      ranking.innerHTML =
        `🥇 ${d.top3.gold}<br>
         🥈 ${d.top3.silver}<br>
         🥉 ${d.top3.bronze}`;
    })
    .catch(()=>{
      err.innerText = "Unable to load submission. Please try again.";
    });
}

function changeWeek(){
  loadSubmission(weekSelect.value);
}
</script>

</body>
</html>
