<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EquitySkill – My Submission</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --primary:#2563eb;
  --bg:#f5f7fb;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#1f2937;
  --muted:#6b7280;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.container{
  max-width:720px;
  margin:30px auto;
  padding:16px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.brand{
  font-size:22px;
  font-weight:800;
  color:var(--primary);
}

.header a{
  text-decoration:none;
  font-weight:600;
  color:var(--primary);
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:18px;
  box-shadow:0 14px 40px rgba(0,0,0,.08);
  margin-bottom:16px;
}

h3{margin:0 0 10px}
p{margin:6px 0;color:var(--muted);font-size:14px}

select{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--border);
  margin-bottom:14px;
  font-weight:600;
}

.list{
  list-style:none;
  padding:0;
  margin:0;
}
.list li{
  padding:10px;
  border-bottom:1px solid var(--border);
}

.stats-tabs{
  display:flex;
  gap:12px;
  margin-bottom:12px;
}

.stats-tabs .tab{
  padding:8px 18px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  font-weight:600;
  background:#e5e7eb;
}

.stats-tabs .tab.active{
  background:var(--primary);
  color:#fff;
}

.edit-btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:var(--primary);
  color:#fff;
  font-weight:700;
  cursor:pointer;
}
</style>

<script src="config.js"></script>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="brand">📄 My Submission</div>
    <a href="dashboard.html">Dashboard</a>
  </div>

  <!-- MODE TOGGLE -->
  <div class="stats-tabs">
    <button class="tab" id="weeklyTab" onclick="switchMode('weekly', this)">Weekly</button>
    <button class="tab" id="dailyTab" onclick="switchMode('daily', this)">Daily</button>
  </div>

  <!-- MODE INFO -->
  <div class="card">
    <h3 id="modeTitle">Loading…</h3>
    <p id="weekText"></p>
  </div>

  <!-- SELECT CONTEST -->
  <div class="card">
    <h3>Select Contest</h3>
    <select id="weekSelect" onchange="loadSubmission()">
      <option>Loading…</option>
    </select>
  </div>

  <!-- PICKS -->
  <div class="card">
    <h3>Your Picks</h3>
    <ul class="list" id="stockList">
      <li>Loading…</li>
    </ul>
  </div>

  <!-- TOP 3 -->
  <div class="card">
    <h3>Your Top 3 Ranking</h3>
    <p id="rankText">—</p>
  </div>

  <!-- EDIT -->
  <div class="card" id="editCard" style="display:none">
    <button class="edit-btn" onclick="editSubmission()">✏️ Edit Submission</button>
  </div>

</div>

<script>
/* ================= SESSION ================= */
const user = JSON.parse(localStorage.getItem("user"));
if(!user) location.href = "login.html";

/* ================= MODE ================= */
let MODE = new URLSearchParams(location.search).get("mode") || "weekly";
const API = getAPI();

/* ================= INIT ================= */
document.getElementById(MODE+"Tab").classList.add("active");
document.getElementById("modeTitle").innerText =
  MODE === "daily"
    ? "📅 Daily Challenge Submission"
    : "🏆 Weekly Challenge Submission";

loadWeeks();

/* ================= MODE SWITCH ================= */
function switchMode(m, btn){
  location.href = `my-submission.html?mode=${m}`;
}

/* ================= LOAD WEEKS ================= */
function loadWeeks(){
  fetch(`${API}?action=mySubmission&username=${encodeURIComponent(user.username)}&list=1`)
    .then(r=>r.json())
    .then(d=>{
      const sel = document.getElementById("weekSelect");
      sel.innerHTML = "";

      if(d.status !== "FOUND"){
        sel.innerHTML = `<option>No submissions found</option>`;
        clearData();
        return;
      }

      d.weeks.forEach(w=>{
        sel.innerHTML += `<option value="${w}">${w}</option>`;
      });

      loadSubmission();
    });
}

/* ================= LOAD SUBMISSION ================= */
function loadSubmission(){

  const week = document.getElementById("weekSelect").value;
  if(!week) return;

  fetch(`${API}?action=mySubmission&username=${encodeURIComponent(user.username)}&week=${week}`)
    .then(r=>r.json())
    .then(d=>{

      if(d.status !== "FOUND"){
        clearData();
        return;
      }

      document.getElementById("weekText").innerText =
        `${MODE.toUpperCase()} – ${d.week}`;

      // Stocks
      const ul = document.getElementById("stockList");
      ul.innerHTML = "";
      d.selected5.forEach(s=>{
        ul.innerHTML += `<li>${s}</li>`;
      });

      // Top 3
      const r = d.top3;
      document.getElementById("rankText").innerHTML = `
        🥇 ${r.gold}<br>
        🥈 ${r.silver}<br>
        🥉 ${r.bronze}
      `;

      // Edit
      document.getElementById("editCard").style.display =
        d.editable ? "block" : "none";
    });
}

function editSubmission(){
  location.href = `play.html?mode=${MODE}&edit=1`;
}

function clearData(){
  document.getElementById("weekText").innerText = "";
  document.getElementById("stockList").innerHTML = `<li>No data</li>`;
  document.getElementById("rankText").innerText = "—";
  document.getElementById("editCard").style.display = "none";
}
</script>

</body>
</html>
