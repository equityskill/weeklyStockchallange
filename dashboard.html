<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EquitySkill – Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
}
.container{
  max-width:900px;
  margin:30px auto;
  padding:20px;
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}
.brand{
  font-size:22px;
  font-weight:800;
  color:#2563eb;
}
.logout{
  background:#ef4444;
  color:#fff;
  border:none;
  padding:10px 14px;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}
.card{
  background:#fff;
  border-radius:16px;
  padding:22px;
  box-shadow:0 14px 40px rgba(0,0,0,0.08);
  margin-bottom:20px;
}
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:16px;
}
.stat{
  background:#f1f5f9;
  border-radius:14px;
  padding:18px;
  text-align:center;
}
.stat h3{
  margin:0;
  font-size:22px;
}
.stat p{
  margin:6px 0 0;
  font-size:13px;
  color:#555;
}
.actions{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;
}
.actions a{
  text-decoration:none;
  background:#2563eb;
  color:#fff;
  padding:16px;
  border-radius:14px;
  text-align:center;
  font-weight:600;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="brand">EquitySkill</div>
    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <div class="card">
    <h2 id="welcome">Welcome</h2>
    <p style="color:#555;">Weekly Skill Challenge Dashboard</p>
  </div>

  <div class="card">
    <h3>Your Stats</h3>
    <div class="stats">
      <div class="stat">
        <h3>—</h3>
        <p>Contests Played</p>
      </div>
      <div class="stat">
        <h3>—</h3>
        <p>Gold Wins</p>
      </div>
      <div class="stat">
        <h3>—</h3>
        <p>Best Rank</p>
      </div>
      <div class="stat">
        <h3>—</h3>
        <p>Avg Return</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>Actions</h3>
    <div class="actions">
      <a href="index.html">Play Weekly Game</a>
      <a href="my-submission.html">My Submission</a>
      <a href="results.html">Results</a>
    </div>
  </div>

</div>

<!-- ✅ CONFIG FIRST -->
<script src="config.js"></script>

<script>
const API = CONFIG.WEB_APP_URL;

// Session check (CRITICAL)
const user = JSON.parse(localStorage.getItem("user"));
if(!user){
  location.href = "login.html";
}

// Welcome text safe rendering
document.getElementById("welcome").innerText =
  "Welcome, " + (user.name || user.username);

// Logout
function logout(){
  localStorage.removeItem("user");
  location.href = "login.html";
}
</script>

</body>
</html>
