<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EquitySkill – Play Challenge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --primary:#2563eb;
  --border:#e5e7eb;
}
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:
    radial-gradient(1200px 600px at 10% -10%, #e0e7ff, transparent),
    radial-gradient(1200px 600px at 90% 10%, #dbeafe, transparent),
    linear-gradient(180deg, #f8fafc, #eef2ff);
}

/* HEADER */
.header{background:#fff;border-bottom:1px solid var(--border)}
.header-inner{
  max-width:1100px;margin:auto;padding:14px 20px;
  display:flex;justify-content:space-between;align-items:center
}
.logo{display:flex;gap:10px;align-items:center;font-weight:800}
.logo span{
  background:#2563eb;color:#fff;width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;border-radius:10px
}
.nav-btn{
  background:#2563eb;color:#fff;padding:8px 16px;
  border-radius:10px;text-decoration:none;font-weight:600
}

/* LAYOUT */
.container{max-width:1100px;margin:30px auto;padding:20px}
.layout{display:grid;grid-template-columns:1fr 420px;gap:30px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}

/* CARD */
.card{
  background:#fff;border-radius:18px;padding:22px;
  box-shadow:0 14px 35px rgba(0,0,0,.08);margin-bottom:20px
}

/* TABLE */
table{border-collapse:collapse;width:100%}
th{font-size:13px;color:#6b7280;text-align:left}
td{padding:6px 4px;font-size:14px}
.col-rank{width:30px;text-align:right}
.col-icon{width:28px;text-align:center}
.col-pct{width:90px;text-align:right;font-weight:600}

/* STOCK GRID */
.stock-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stock{
  padding:12px;border:1px solid var(--border);
  border-radius:12px;text-align:center;cursor:pointer
}
.stock.selected{background:#dbeafe;border-color:#2563eb}

/* DRAG */
.rank-box{
  border:2px dashed #c7d2fe;border-radius:14px;
  padding:10px;margin-bottom:12px;background:#f8fafc
}
.rank-box.active{border-color:#2563eb}
.slot{min-height:44px}

.draggable{
  background:#e0e7ff;
  padding:10px;
  border-radius:10px;
  cursor:grab;
  text-align:center;
  user-select:none;
}

/* BUTTON */
button{
  width:100%;padding:14px;background:#2563eb;
  color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer
}
.error{color:#dc2626;font-size:13px}

.disabled-card {
  opacity: 0.4;
  pointer-events: none;
  filter: grayscale(1);
}

</style>

<script src="config.js"></script>
</head>

<body>

<div class="header">
  <div class="header-inner">
    <div class="logo"><span>ES</span> EquitySkill</div>
    <a href="dashboard.html" class="nav-btn">Dashboard</a>
  </div>
</div>

<div class="container">
<div class="layout">

<!-- LEFT -->
<div class="card">
  <h3 id="rankingTitle">Loading Ranking...</h3>
  <table>
    <thead>
      <tr>
        <th class="col-rank">#</th>
        <th class="col-icon"></th>
        <th>Stock</th>
        <th class="col-pct">Change %</th>
      </tr>
    </thead>
    <tbody id="liveRanking"></tbody>
  </table>
</div>

<!-- RIGHT -->
<div>

<!-- STEP 1 -->
<div class="card" id="step1">
  <h3 id="selectionTitle">Select 5 Stocks</h3>
<p class="note" id="submissionInfo"></p>

  <div class="stock-grid" id="stockList"></div>
  <p>Selected <b><span id="count">0</span>/5</b></p>
  <div class="error" id="err"></div>
  <button onclick="goNext()">Continue</button>
</div>


<!-- CLOSED MESSAGE -->
<div class="card" id="closedMessage" style="display:none">
  <h3 style="color:#dc2626" id="closedTitle"></h3>
  <p id="closedTimer" class="note"></p>
</div>
<!-- STEP 2 -->
<div class="card" id="step2" style="display:none">
  <h3>Rank Your Top 3</h3>

  <div class="rank-box" id="box-gold">
    <h4>🥇 Gold</h4>
    <div class="slot" id="gold"
      ondrop="drop(event,'gold')"
      ondragover="allowDrop(event)">
    </div>
  </div>

  <div class="rank-box" id="box-silver">
    <h4>🥈 Silver</h4>
    <div class="slot" id="silver"
      ondrop="drop(event,'silver')"
      ondragover="allowDrop(event)">
    </div>
  </div>

  <div class="rank-box" id="box-bronze">
    <h4>🥉 Bronze</h4>
    <div class="slot" id="bronze"
      ondrop="drop(event,'bronze')"
      ondragover="allowDrop(event)">
    </div>
  </div>

  <h4>Remaining Stocks</h4>
  <div class="stock-grid" id="remaining"
    ondrop="dropToRemaining(event)"
    ondragover="allowDrop(event)">
  </div>

  <div class="error" id="rankErr"></div>
  <button onclick="submitFinal()">Submit Entry</button>
</div>

</div>
</div>
</div>

<script>
const MODE = getGameMode();
const API = getAPI();

/* ===== CONTEST STATUS HANDLING ===== */





let STOCKS=[], selected=[];
let ranking={gold:null,silver:null,bronze:null};
let selectedRank=null;
let CURRENT_WEEK="";

/* INIT */
window.onload = () => {
  loadStocks();
  loadRanking();
};

setInterval(applyContestStatus, 1000); // ⏱ live countdown

 
/* LOAD STOCKS */
function loadStocks(){
  fetch(API+"?action=init")
    .then(r=>r.json())
    .then(d=>{
      STOCKS = d.stocks || [];

      CURRENT_WEEK = MODE === "daily" ? d.day : d.week;
      localStorage.setItem("CURRENT_WEEK", CURRENT_WEEK);

      renderStocks();
      // ❌ NO already-submitted check here
    });
}




function renderStocks(){
  stockList.innerHTML = "";
  selected = [];
  count.innerText = 0;

  STOCKS.forEach(s=>{
    const d = document.createElement("div");
    d.className = "stock";
    d.innerText = s;
    d.onclick = ()=>toggle(s,d);
    stockList.appendChild(d);
  });
}



function toggle(s,el){
 if(selected.includes(s)){
  selected=selected.filter(x=>x!==s);
  el.classList.remove("selected");
 }else if(selected.length<5){
  selected.push(s);
  el.classList.add("selected");
 }
 count.innerText=selected.length;
}

/* STEP */
function goNext(){
 if(selected.length!==5){err.innerText="Select exactly 5 stocks";return;}
 step1.style.display="none";
 step2.style.display="block";
 remaining.innerHTML="";
 selected.forEach(s=>{
  remaining.appendChild(makeDraggable(s));
 });
}

/* DRAG HELPERS */
function makeDraggable(stock){
 const d=document.createElement("div");
 d.className="draggable";
 d.id=stock;
 d.innerText=stock;
 d.draggable=true;
 d.ondragstart=drag;
 return d;
}

function drag(e){e.dataTransfer.setData("text",e.target.id);}
function allowDrop(e){e.preventDefault();}

/* DROP TO SLOT */
function drop(e,pos){
 e.preventDefault();
 const stock=e.dataTransfer.getData("text");

 if(ranking[pos]) return;
 if(Object.values(ranking).includes(stock)) return;

 ranking[pos]=stock;
 document.getElementById(stock)?.remove();
 renderRanks();
}

/* DROP BACK */
function dropToRemaining(e){
 e.preventDefault();
 const stock=e.dataTransfer.getData("text");

 Object.keys(ranking).forEach(k=>{
  if(ranking[k]===stock) ranking[k]=null;
 });

 remaining.appendChild(makeDraggable(stock));
 renderRanks();
}

/* CLICK SWAP */
function selectRank(pos){
 if(!ranking[pos]) return;

 if(!selectedRank){
  selectedRank=pos;
  document.getElementById("box-"+pos).classList.add("active");
  return;
 }

 if(selectedRank===pos){
  resetSelect();return;
 }

 [ranking[pos],ranking[selectedRank]]=
 [ranking[selectedRank],ranking[pos]];

 renderRanks();
 resetSelect();
}

function resetSelect(){
 ["gold","silver","bronze"].forEach(p=>{
  document.getElementById("box-"+p).classList.remove("active");
 });
 selectedRank=null;
}

/* RENDER RANKS */
function renderRanks(){
 ["gold","silver","bronze"].forEach(p=>{
  const slot=document.getElementById(p);
  slot.innerHTML="";
  if(!ranking[p]) return;

  const d=makeDraggable(ranking[p]);
  d.onclick=()=>selectRank(p);
  slot.appendChild(d);
 });
}




/* RANKING */
function loadRanking(){
  fetch(API + "?action=homeRanking")
    .then(r => r.json())
    .then(d => {

      // 🔑 TITLE FIX
      if (d.mode === "LAST") {
        // Previous completed contest
        rankingTitle.innerText =
          MODE === "daily"
            ? `Previous Day Ranking – ${d.day || ""}`
            : `Previous Week Ranking – ${d.week || ""}`;

      } else {
        // Live contest
        const label =
          MODE === "daily"
            ? (d.day || localStorage.getItem("CURRENT_WEEK") || "")
            : (d.week || localStorage.getItem("CURRENT_WEEK") || "");

        rankingTitle.innerText =
          MODE === "daily"
            ? `Daily Live Ranking – ${label}`
            : `Weekly Live Ranking – ${label}`;
      }

      // 🔄 RENDER TABLE
      liveRanking.innerHTML = "";

      (d.ranking || []).forEach((r, i) => {
        let icon =
          i === 0 ? "🥇" :
          i === 1 ? "🥈" :
          i === 2 ? "🥉" :
          i < 5  ? "🔥" : "";

        liveRanking.innerHTML += `
          <tr>
            <td class="col-rank">${i + 1}</td>
            <td class="col-icon">${icon}</td>
            <td>${r.stock}</td>
            <td class="col-pct">${r.pct}%</td>
          </tr>`;
      });
    });
}



const STATUS_API = API;


function msToTime(ms){
  const h = Math.floor(ms / (1000*60*60));
  const m = Math.floor((ms % (1000*60*60)) / (1000*60));
  const s = Math.floor((ms % (1000*60)) / 1000);
  return `${h}h ${m}m ${s}s`;
}

function applyContestStatus(){
  
  fetch(`${API}?action=contestStatus`)
    .then(r => r.json())
    .then(d => {

      if (document.getElementById("step2").style.display === "block") {
  return; // user already in step2, don't interfere
}

      const step1 = document.getElementById("step1");
      const step2 = document.getElementById("step2");
      const closed = document.getElementById("closedMessage");
      const timer = document.getElementById("closedTimer");

      const title = document.getElementById("selectionTitle");
      const info  = document.getElementById("submissionInfo");

      const week =
  MODE === "daily"
    ? d.current_day
    : d.current_week || "";

      if(d.status === "OPEN"){
        step1.style.display = "block";
        closed.style.display = "none";

  title.innerText =
  MODE === "daily"
    ? `Select 5 Stocks (${prettyDate(d.current_day)})`
    : `Select 5 Stocks (${week})`;

        info.innerText =
          `⏳ Submission closes in ${msToTime(d.remainingMs)}`;

      } else {
        step1.style.display = "none";
        step2.style.display = "none";
        closed.style.display = "block";

        timer.innerText =
          `${d.message}: ${msToTime(d.remainingMs)}`;
      }
    });

    const closedTitle = document.getElementById("closedTitle");
closedTitle.innerText =
  MODE === "daily"
    ? "⛔ Daily Submission Closed"
    : "⛔ Weekly Submission Closed";

}

function shortDate(d){
  const dt = new Date(d);
  const dd = String(dt.getDate()).padStart(2,"0");
  const mm = String(dt.getMonth()+1).padStart(2,"0");
  const yy = String(dt.getFullYear()).slice(-2);
  return `${dd}-${mm}-${yy}`;
}




 //  function checkAlreadySubmitted() {
 // const user = JSON.parse(localStorage.getItem("user") || "{}");
 // if (!user.username || !CURRENT_WEEK) return;

  // Use correct parameter based on mode
 // const param = MODE === "daily" ? "day" : "week";
 // const url = `${API}?action=mySubmission&username=${encodeURIComponent(user.username)}&${param}=${CURRENT_WEEK}`;
  
 // fetch(url)
 //   .then(r => r.json())
 //   .then(d => {
 //     if (d.status === "FOUND") {
 //       alert("You have already submitted for " + (MODE === "daily" ? "today" : "this week") + ".");
 //       location.href = `my-submission.html?mode=${MODE}`;
 //     }
 //   });
//}
function submitFinal(){

  if(!ranking.gold || !ranking.silver || !ranking.bronze){
    rankErr.innerText = "Please rank Gold, Silver & Bronze";
    return;
  }

  const user = JSON.parse(localStorage.getItem("user") || "{}");
  if(!user.username){
    location.href = "login.html";
    return;
  }

  const top3 = {
    gold: ranking.gold,
    silver: ranking.silver,
    bronze: ranking.bronze
  };

  const params = new URLSearchParams({
    action: "submitEntry",
    username: user.username,
    email: user.email || "",
    phone: user.phone || "",
    selected5: JSON.stringify(selected),
    top3: JSON.stringify(top3)
  });

  if (MODE === "daily") {
    params.append("day", CURRENT_WEEK);
  } else {
    params.append("week", CURRENT_WEEK);
  }

  const btn = document.querySelector("#step2 button");
  btn.disabled = true;
  btn.innerText = "Submitting...";

  fetch(API + "?" + params.toString())
    .then(r => r.json())
    .then(res => {

      btn.disabled = false;
      btn.innerText = "Submit Entry";

      if (res.success) {
        alert("✅ Submission successful!");
        location.href = "dashboard.html";
        return;
      }

      if (
        res.message === "Already submitted today" ||
        res.message === "Already submitted this week"
      ) {
        alert(
          MODE === "daily"
            ? "You have already submitted for today."
            : "You have already submitted for this week."
        );
        location.href = `my-submission.html?mode=${MODE}`;
        return;
      }

      alert(res.message || "❌ Submission failed");
    })
    .catch(() => {
      btn.disabled = false;
      btn.innerText = "Submit Entry";
      alert("⚠️ Network error");
    });
}

function prettyDate(d){
  return new Date(d).toDateString(); 
}


</script>

</body>
</html>
