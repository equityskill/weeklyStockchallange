<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EquitySkill – Results</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --primary:#2563eb;
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --border:#e5e7eb;
}
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:
    radial-gradient(1200px 600px at 10% -10%, #e0e7ff, transparent),
    radial-gradient(1200px 600px at 90% 10%, #dbeafe, transparent),
    linear-gradient(180deg, #f8fafc, #eef2ff);
  color:var(--text);
}

/* HEADER */
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.topbar-inner{
  max-width:1100px;margin:auto;
  padding:14px 20px;
  display:flex;justify-content:space-between;align-items:center;
}
.brand{display:flex;gap:12px;align-items:center}
.logo-box{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:#fff;font-weight:900;
  display:flex;align-items:center;justify-content:center;
}
.brand-name{font-weight:800}
.brand-tagline{font-size:11px;color:#6b7280}
.right{display:flex;gap:14px;align-items:center}
.status{
  font-size:12px;font-weight:700;
  padding:6px 14px;border-radius:20px;
  background:#eef2ff;color:#3730a3;
}
.nav-btn{
  text-decoration:none;
  padding:8px 16px;
  border-radius:10px;
  font-size:14px;
  font-weight:600;
  background:#e5e7eb;
  color:#111827;
}
.nav-btn:hover{background:#dbeafe}

/* LAYOUT */
.container{
  max-width:900px;
  margin:30px auto 60px;
  padding:20px;
}

/* CARD */
.card{
  background:#fff;
  border-radius:16px;
  padding:22px;
  box-shadow:0 14px 35px rgba(0,0,0,.08);
  margin-bottom:22px;
}

h2,h3{margin:0 0 10px}
p{margin:0 0 10px;color:var(--muted);font-size:14px}

/* BADGES */
.badge{
  display:inline-block;
  padding:8px 18px;
  border-radius:20px;
  font-size:14px;
  font-weight:700;
}
.badge.win{background:#dcfce7;color:#166534}
.badge.nowin{background:#fee2e2;color:#991b1b}

/* LIST */
.list{list-style:none;padding:0;margin:0}
.list li{
  padding:12px 10px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  gap:10px;
}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{
  padding:10px;
  border-bottom:1px solid var(--border);
  text-align:left;
}
th{color:var(--muted)}

/* SELECT */
select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  margin-top:10px;
}

.stats-tabs{
  display:flex;
  gap:12px;
}
.tab{
  padding:8px 18px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  font-weight:700;
  background:#e5e7eb;
}
.tab.active{
  background:#2563eb;
  color:#fff;
}

</style>

<script src="config.js"></script>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo-box">ES</div>
      <div>
        <div class="brand-name">EquitySkill</div>
        <div class="brand-tagline" id="pageTagline"></div>
      </div>
    </div>
    <div class="right">
      <span class="status">● Results</span>
      <a class="nav-btn" href="index.html">Home</a>
      <a class="nav-btn" href="dashboard.html">Dashboard</a>
    </div>
  </div>
</header>

<div class="container">

  <div class="card" style="padding:14px">
  <div class="stats-tabs">
    <button class="tab active" onclick="switchMode('weekly', this)">Weekly</button>
    <button class="tab" onclick="switchMode('daily', this)">Daily</button>
  </div>
</div>

<!-- CURRENT RESULT 
<div class="card">
  <h2 id="resultTitle"></h2>
  <p id="weekText">Loading…</p>
  <div id="winnerBox"></div>
</div> -->


<!----
<div class="card">
  <h3 id="topTitle"></h3>
  <ul class="list" id="topList"></ul>
</div>
-->
<!-- PREVIOUS -->
<div class="card">
  <h3>📅 View Previous Results</h3>
  <select id="periodSelect" onchange="loadSelectedPeriod()">
    <option>Loading…</option>
  </select>

  <table style="margin-top:15px">
    <thead>
      <tr>
        <th>#</th>
        <th>Stock</th>
        <th>Result</th>
      </tr>
    </thead>
    <tbody id="stockTable">
      <tr><td colspan="3">Select a period</td></tr>
    </tbody>
  </table>
</div>

</div>

<script>
/* ===== MODE & API ===== */
let MODE = "weekly";
let API = CONFIG.WEEKLY_WEB_APP_URL;

function switchMode(mode, btn){
  MODE = mode;
  API = mode === "daily"
    ? CONFIG.DAILY_WEB_APP_URL
    : CONFIG.WEEKLY_WEB_APP_URL;

  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  document.getElementById("pageTagline").innerText =
    mode === "daily" ? "Daily Results" : "Weekly Results";

   loadPreviousPeriods();
}


/* ===== AUTH ===== */
const user = JSON.parse(localStorage.getItem("user"));
if(!user){
  location.href = "login.html";
}

/* ===== UI TEXT ===== */
document.getElementById("pageTagline").innerText =
  MODE === "daily" ? "Daily Results" : "Weekly Results";

/* ===== INIT ===== */
window.onload = () => {
    loadPreviousPeriods();
};

/* ===== CURRENT RESULT ===== */
function loadCurrentResult(){
  fetch(API + "?action=weeklyResult")
    .then(r => r.json())
    .then(d => {

      if(!d || !d.week){
        weekText.innerText = "Results not available";
        return;
      }

      weekText.innerText =
        MODE === "daily" ? `Date: ${d.week}` : `Week: ${d.week}`;

      if(!d.winners || d.winners.length === 0){
        winnerBox.innerHTML = ""; // winner logic paused for now

      }else{
        winnerBox.innerHTML =
          `<span class="badge win">🏆 Winners (${d.winnerCount}): ${d.winners.join(", ")}</span>`;
      }

      
      
    });
}

/* ===== PREVIOUS ===== */
function loadPreviousPeriods(){
  fetch(API + "?action=previousResults")
    .then(r=>r.json())
    .then(d=>{
      periodSelect.innerHTML="";

      const list = MODE === "daily"
        ? (d.days || [])
        : (d.results || []).map(r=>r.week);

      if(!list.length){
        periodSelect.innerHTML = `<option>No data</option>`;
        return;
      }

      list.forEach(v=>{
  const o = document.createElement("option");
  o.value = v;                  // ❗ original value (important)
  o.innerText = formatDisplayDate(v); // 👈 fancy display
  periodSelect.appendChild(o);
});


      loadSelectedPeriod();
    });
}


function loadSelectedPeriod(){
  const val = periodSelect.value;
  if(!val) return;

  const url = MODE === "daily"
    ? `${API}?action=dailyResult&day=${encodeURIComponent(val)}`
    : `${API}?action=weeklyResult&week=${encodeURIComponent(val)}`;

  fetch(url)
    .then(r=>r.json())
    .then(d=>{
      stockTable.innerHTML="";

      if(!d.ranking || !d.ranking.length){
        stockTable.innerHTML =
          `<tr><td colspan="3">No data</td></tr>`;
        return;
      }

      d.ranking.slice(0,15).forEach((s,i)=>{
        const badge =
          i===0?"🥇 Gold":
          i===1?"🥈 Silver":
          i===2?"🥉 Bronze":
          i<5?"🔥 Top 5":"";

        stockTable.innerHTML += `
          <tr>
            <td>${i+1}</td>
            <td>${s.stock} (${s.pct}%)</td>
            <td>${badge}</td>
          </tr>`;
      });
    });
}

function formatDisplayDate(val){
  const d = new Date(val);
  if (isNaN(d)) return val;

  return d.toLocaleDateString("en-IN", {
    day: "numeric",
    month: "short",
    year: "numeric",
    weekday: "short"
  });
}

</script>

</body>
</html>
